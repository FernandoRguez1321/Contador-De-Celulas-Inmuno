<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenCV.js</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1a1a1a; --muted:#666;
    --accent:#2563eb; --border:#e2e4e8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15161a; --card:#1f2024; --text:#eaeaea; --muted:#9aa0a6;
      --accent:#5b8dfb; --border:#33353b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15161a; --card:#1f2024; --text:#eaeaea; --muted:#9aa0a6;
    --accent:#5b8dfb; --border:#33353b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 40px;
  }
  .wrap{max-width:720px; margin:0 auto}
  h1{font-size:1.3rem; margin:0 0 4px}
  p.sub{color:var(--muted); margin:0 0 20px; font-size:.9rem}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px; margin-bottom:16px;
  }
  #status{font-size:.85rem; color:var(--muted); margin-bottom:12px}
  input[type=file]{width:100%; margin-bottom:14px; color:var(--text)}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:9px 14px; font-size:.9rem; cursor:pointer;
  }
  button:disabled{opacity:.4; cursor:not-allowed}
  .canvases{
    display:flex; flex-wrap:wrap; gap:14px; overflow-x:auto;
  }
  .canvas-box{flex:1; min-width:220px}
  .canvas-box h3{font-size:.8rem; color:var(--muted); margin:0 0 6px; font-weight:500}
  canvas{max-width:100%; width:100%; border-radius:8px; border:1px solid var(--border); background:#000}
</style>
</head>
<body>
<div class="wrap">
  <h1>Demo de OpenCV.js</h1>
  <p class="sub">Procesamiento de imágenes en el navegador con OpenCV cargado desde un CDN.</p>

  <div class="card">
    <div id="status">Cargando OpenCV.js…</div>
    <input type="file" id="fileInput" accept="image/*" disabled>
    <div class="btns">
      <button id="btnGray" disabled>Escala de grises</button>
      <button id="btnEdges" disabled>Detección de bordes (Canny)</button>
      <button id="btnBlur" disabled>Desenfoque Gaussiano</button>
      <button id="btnOriginal" disabled>Original</button>
    </div>
  </div>

  <div class="card canvases">
    <div class="canvas-box">
      <h3>Entrada</h3>
      <canvas id="canvasInput"></canvas>
    </div>
    <div class="canvas-box">
      <h3>Salida</h3>
      <canvas id="canvasOutput"></canvas>
    </div>
  </div>
</div>

<!-- OpenCV.js servido vía jsDelivr (build de @techstark/opencv-js) -->
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js/dist/opencv.js"></script>

<script>
const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
const canvasInput = document.getElementById('canvasInput');
const canvasOutput = document.getElementById('canvasOutput');
const btns = ['btnGray','btnEdges','btnBlur','btnOriginal'].map(id => document.getElementById(id));

let img = null;
let ready = false;

// El build de @techstark/opencv-js expone `cv` como una promesa que resuelve
// en el objeto real una vez que el runtime de WebAssembly termina de cargar.
function waitForCv(){
  if (typeof cv !== 'undefined' && cv instanceof Promise) {
    cv.then(resolved => {
      window.cv = resolved;
      onOpenCvReady();
    });
  } else if (typeof cv !== 'undefined' && cv.Mat) {
    onOpenCvReady();
  } else {
    setTimeout(waitForCv, 100);
  }
}

function onOpenCvReady(){
  ready = true;
  statusEl.textContent = 'OpenCV.js listo. Elige una imagen para empezar.';
  fileInput.disabled = false;
}

waitForCv();

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    img = new Image();
    img.onload = () => {
      const ctx = canvasInput.getContext('2d');
      canvasInput.width = img.width;
      canvasInput.height = img.height;
      ctx.drawImage(img, 0, 0);
      canvasOutput.width = img.width;
      canvasOutput.height = img.height;
      btns.forEach(b => b.disabled = false);
      statusEl.textContent = `Imagen cargada (${img.width}×${img.height}).`;
      drawOriginalOnOutput();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
});

function drawOriginalOnOutput(){
  const ctx = canvasOutput.getContext('2d');
  ctx.drawImage(canvasInput, 0, 0);
}

function withMat(fn){
  try {
    const src = cv.imread(canvasInput);
    fn(src);
    src.delete();
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Ocurrió un error procesando la imagen: ' + err.message;
  }
}

document.getElementById('btnGray').addEventListener('click', () => {
  withMat(src => {
    const dst = new cv.Mat();
    cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
    cv.imshow('canvasOutput', dst);
    dst.delete();
  });
});

document.getElementById('btnEdges').addEventListener('click', () => {
  withMat(src => {
    const gray = new cv.Mat();
    const edges = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.Canny(gray, edges, 50, 150);
    cv.imshow('canvasOutput', edges);
    gray.delete();
    edges.delete();
  });
});

document.getElementById('btnBlur').addEventListener('click', () => {
  withMat(src => {
    const dst = new cv.Mat();
    const ksize = new cv.Size(9, 9);
    cv.GaussianBlur(src, dst, ksize, 0, 0, cv.BORDER_DEFAULT);
    cv.imshow('canvasOutput', dst);
    dst.delete();
  });
});

document.getElementById('btnOriginal').addEventListener('click', drawOriginalOnOutput);
</script>
</body>
</html>
